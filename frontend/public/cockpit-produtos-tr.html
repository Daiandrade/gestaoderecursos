<style>
  :root{
    --bg:#f4f5f3;
    --panel:#ffffff;
    --ink:#1a2230;
    --ink-soft:#5b6677;
    --ink-faint:#8b96a7;
    --line:#e6e8e4;
    --navy:#10243b;
    --navy-2:#1a3552;
    --amber:#e08a1e;
    --amber-soft:#fbeed6;
    --green:#1f9d6b;
    --green-soft:#e0f3ea;
    --red:#d2453b;
    --red-soft:#fbe4e2;
    --blue:#2a6fb0;
    --blue-soft:#e2eef8;
    --teal:#0f8b8d;
    --shadow:0 1px 2px rgba(16,36,59,.05), 0 8px 24px rgba(16,36,59,.06);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1360px;margin:0 auto;padding:0 28px 80px}

  /* ---------- HEADER ---------- */
  header{
    background:linear-gradient(115deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;position:relative;overflow:hidden;
  }
  header::after{
    content:&quot;&quot;;position:absolute;right:-80px;top:-120px;width:420px;height:420px;
    background:radial-gradient(circle,rgba(224,138,30,.28),transparent 65%);
  }
  .header-inner{max-width:1360px;margin:0 auto;padding:30px 28px 26px;position:relative;z-index:2}
  .eyebrow{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9fb6cc;font-weight:600}
  h1{font-family:'Sora';font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
  .sub{color:#b9c7d6;font-size:14px;margin-top:6px;max-width:640px}
  .header-meta{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
  .filters{display:flex;gap:10px;flex-wrap:wrap}
  .chip{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#dce6f0;
    padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;
  }
  .chip b{color:#fff;font-weight:600}
  .chip.active{background:var(--amber);border-color:var(--amber);color:#211405;font-weight:600}
  .updated{font-family:'IBM Plex Mono';font-size:11.5px;color:#9fb6cc;text-align:right}
  .mock-flag{display:inline-block;background:var(--amber-soft);color:#7a4708;font-size:10.5px;font-weight:700;
    letter-spacing:.08em;padding:3px 9px;border-radius:5px;text-transform:uppercase;margin-top:8px}

  /* ---------- SECTION STRUCTURE ---------- */
  .section{margin-top:34px}
  .section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;padding-bottom:9px;border-bottom:2px solid var(--line)}
  .section-num{font-family:'IBM Plex Mono';font-size:13px;font-weight:700;color:#fff;background:var(--navy);
    width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .section-title{font-family:'Sora';font-size:19px;font-weight:700;letter-spacing:-.01em}
  .section-desc{font-size:12.5px;color:var(--ink-faint);margin-left:auto;text-align:right;max-width:340px}

  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g23{grid-template-columns:1.6fr 1fr}
  .g32{grid-template-columns:1fr 1.5fr}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
  .card h3{font-family:'Sora';font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:14px;
    display:flex;align-items:center;gap:8px}
  .card h3 .dot{width:8px;height:8px;border-radius:50%}

  /* KPI cards */
  .kpi{display:flex;flex-direction:column;gap:3px}
  .kpi .label{font-size:12px;color:var(--ink-soft);font-weight:500;display:flex;align-items:center;gap:7px}
  .kpi .val{font-family:'Sora';font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
  .kpi .delta{font-family:'IBM Plex Mono';font-size:11.5px;font-weight:600;margin-top:3px;display:flex;align-items:center;gap:5px}
  .up{color:var(--green)} .down{color:var(--red)} .neutral{color:var(--ink-faint)}
  .kpi-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:4px}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-weight:600;color:var(--ink-faint);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;padding:7px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid #f0f1ee;color:var(--ink)}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums}
  .tower{font-weight:600;display:flex;align-items:center;gap:8px}
  .tw-tag{width:9px;height:9px;border-radius:3px;flex:0 0 auto}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono'}
  .pill.g{background:var(--green-soft);color:#0c6a47}
  .pill.a{background:var(--amber-soft);color:#8a5410}
  .pill.r{background:var(--red-soft);color:#9c2820}
  .pill.b{background:var(--blue-soft);color:#1c517f}

  /* bars */
  .bar-track{background:#eef0ec;border-radius:6px;height:8px;overflow:hidden;width:100%}
  .bar-fill{height:100%;border-radius:6px}

  /* status page */
  .status-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f0f1ee}
  .status-row:last-child{border-bottom:none}
  .status-left{display:flex;align-items:center;gap:11px}
  .status-light{width:11px;height:11px;border-radius:50%;flex:0 0 auto;position:relative}
  .status-light.op{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
  .status-light.dg{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
  .status-light.out{background:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
  .uptime-bars{display:flex;gap:2px;align-items:flex-end}
  .ub{width:5px;height:22px;border-radius:2px;background:var(--green)}
  .ub.dg{background:var(--amber)} .ub.out{background:var(--red)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:14px}
  .legend span{display:flex;align-items:center;gap:6px}
  .lg-dot{width:9px;height:9px;border-radius:3px}

  /* okr */
  .okr{margin-bottom:15px}
  .okr:last-child{margin-bottom:0}
  .okr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px}
  .okr-name{font-size:13px;font-weight:600}
  .okr-pct{font-family:'IBM Plex Mono';font-size:13px;font-weight:700}
  .okr-meta{font-size:11px;color:var(--ink-faint);margin-top:4px}

  /* donut */
  .donut-wrap{display:flex;align-items:center;gap:18px}
  .donut-legend{font-size:12px;display:flex;flex-direction:column;gap:9px}
  .donut-legend .li{display:flex;align-items:center;gap:8px}
  .donut-legend .li b{font-family:'IBM Plex Mono';margin-left:auto;font-weight:700}

  /* finance */
  .fin-total{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:6px}
  .fin-total .b{display:flex;flex-direction:column}
  .fin-total .b .l{font-size:11.5px;color:var(--ink-soft)}
  .fin-total .b .v{font-family:'Sora';font-size:26px;font-weight:800;letter-spacing:-.02em}

  /* enhancement kanban */
  .kan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kan-col{background:#f7f8f6;border:1px solid var(--line);border-radius:11px;padding:12px}
  .kan-col h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);
    display:flex;justify-content:space-between;margin-bottom:10px}
  .kan-col h4 span{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink)}
  .kan-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;font-size:12px}
  .kan-card:last-child{margin-bottom:0}
  .kan-card .t{font-weight:600;margin-bottom:5px;line-height:1.3}
  .kan-card .m{font-size:10.5px;color:var(--ink-faint);display:flex;justify-content:space-between}

  .note{font-size:11.5px;color:var(--ink-faint);margin-top:12px;display:flex;align-items:flex-start;gap:7px;
    background:#f7f8f6;border:1px dashed var(--line);border-radius:9px;padding:9px 12px}
  .note b{color:var(--ink-soft)}

  /* ---------- PROGRAM CARDS ---------- */
  .program-card{
    background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;box-shadow:var(--shadow);transition:all .3s ease;
    cursor:pointer;position:relative;overflow:hidden;
  }
  .program-card::before{
    content:&quot;&quot;;position:absolute;top:0;left:0;right:0;height:3px;
    transition:height .3s ease;
  }
  .program-card:hover{
    border-color:var(--blue);
    box-shadow:0 2px 4px rgba(16,36,59,.08), 0 12px 36px rgba(42,111,176,.15);
    transform:translateY(-2px);
  }
  .program-card.calendar::before{background:linear-gradient(90deg,var(--blue),var(--teal))}
  .program-card.agenda::before{background:linear-gradient(90deg,#7a5cc4,var(--blue))}
  .program-card.roadmap::before{background:linear-gradient(90deg,var(--amber),var(--green))}
  .program-card:hover::before{height:5px}

  .prog-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
  .prog-icon{
    width:46px;height:46px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-size:24px;flex-shrink:0;
  }
  .program-card.calendar .prog-icon{background:var(--blue-soft);color:var(--blue)}
  .program-card.agenda .prog-icon{background:#e8e3f5;color:#7a5cc4}
  .program-card.roadmap .prog-icon{background:var(--amber-soft);color:var(--amber)}

  .prog-info h4{font-family:'Sora';font-size:15px;font-weight:700;margin-bottom:4px;color:var(--ink)}
  .prog-info p{font-size:11.5px;color:var(--ink-faint);line-height:1.5}

  .prog-features{margin-top:10px;padding-top:10px;border-top:1px solid #f0f1ee}
  .prog-feat{
    display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:11.5px;
  }
  .prog-feat:last-child{margin-bottom:0}
  .prog-feat .ico{font-size:12px;color:var(--green)}
  .prog-feat .txt{color:var(--ink-soft)}

  .prog-cta{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--navy);color:#fff;padding:7px 14px;
    border-radius:7px;font-weight:600;font-size:12px;
    transition:.2s;margin-top:10px;
  }
  .program-card:hover .prog-cta{
    background:var(--navy-2);transform:translateX(2px);
  }

  .sparkline{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:8px}
  .sp{width:100%;background:var(--blue-soft);border-radius:2px 2px 0 0}
  .sp.hi{background:var(--blue)}

  footer{text-align:center;color:var(--ink-faint);font-size:11.5px;margin-top:46px;padding-top:18px;border-top:1px solid var(--line)}

  /* ---------- LOCKED FINANCE SECTION ---------- */
  .locked-section{margin-top:46px}
  .lock-bar{
    display:flex;align-items:center;gap:14px;
    background:#0d1c2e;color:#cdd9e5;border:1px solid #213650;border-radius:12px;
    padding:14px 18px;cursor:pointer;transition:.2s;user-select:none;position:relative;overflow:hidden;
  }
  .lock-bar:hover{background:#11253b;border-color:#2c4a6a}
  .lock-bar .lk-ico{font-size:18px;opacity:.85}
  .lock-bar .lk-txt{flex:1}
  .lock-bar .lk-txt .t{font-family:'Sora';font-weight:700;font-size:14px;color:#eaf1f7}
  .lock-bar .lk-txt .s{font-size:11.5px;color:#7e93a8;margin-top:2px}
  .lock-bar .lk-cta{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:#0d1c2e;background:var(--amber);padding:6px 12px;border-radius:7px;font-weight:700}
  .lock-bar .lk-chev{font-size:13px;color:#7e93a8;transition:.25s}
  .lock-bar.open .lk-chev{transform:rotate(180deg)}

  .lock-panel{max-height:0;overflow:hidden;transition:max-height .45s ease;opacity:0}
  .lock-panel.open{max-height:6000px;opacity:1;transition:max-height .6s ease,opacity .4s ease .1s}
  .lock-inner{padding-top:18px}

  .auth-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px;box-shadow:var(--shadow);max-width:440px;margin:14px auto 0;text-align:center}
  .auth-box .ab-ico{font-size:30px}
  .auth-box h4{font-family:'Sora';font-size:16px;margin-top:8px}
  .auth-box p{font-size:12.5px;color:var(--ink-faint);margin-top:6px;line-height:1.5}
  .auth-row{display:flex;gap:8px;margin-top:16px}
  .auth-row input{flex:1;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:14px;
    font-family:'IBM Plex Mono';outline:none}
  .auth-row input:focus{border-color:var(--blue)}
  .auth-row button{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:0 18px;
    font-weight:600;font-size:13px;cursor:pointer;font-family:'IBM Plex Sans'}
  .auth-row button:hover{background:var(--navy-2)}
  .auth-err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;font-weight:600}
  .auth-hint{font-size:11px;color:var(--ink-faint);margin-top:10px;font-family:'IBM Plex Mono'}

  .confidential{display:inline-flex;align-items:center;gap:6px;background:var(--red-soft);color:#9c2820;
    font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:5px}

  @media(max-width:980px){
    .g4,.g3,.g23,.g32,.kan{grid-template-columns:1fr 1fr}
    .g2{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .g4,.g3,.g2,.g23,.g32,.kan{grid-template-columns:1fr}
    h1{font-size:26px}
  }
</style>
</head>

<div class=&quot;wrap&quot;>

          <tbody>
            <tr><td class=&quot;tower&quot;><span class=&quot;tw-tag&quot; style=&quot;background:#2a6fb0&quot;></span>TaxOne</td><td class=&quot;num&quot;>312</td><td class=&quot;num&quot;>298</td><td class=&quot;num&quot;><span class=&quot;pill r&quot;>14</span></td><td class=&quot;num&quot;>221</td><td class=&quot;num&quot;>91</td><td class=&quot;num&quot;>23</td></tr>

            <tr><td class=&quot;tower&quot;><span class=&quot;tw-tag&quot; style=&quot;background:#e08a1e&quot;></span>DFe</td><td class=&quot;num&quot;>276</td><td class=&quot;num&quot;>259</td><td class=&quot;num&quot;><span class=&quot;pill r&quot;>17</span></td><td class=&quot;num&quot;>203</td><td class=&quot;num&quot;>73</td><td class=&quot;num&quot;>31</td></tr>

.user-chip .meta { overflow:hidden; }
.user-chip .meta b { font-size:12.5px; display:block; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
.user-chip .meta span { font-size:11px; color:var(--text-3); }

/* ---------- Main --------------------------------------------------- */
.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 26px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 19px; }
.topbar .page-sub { font-size: 12.5px; color: var(--text-3); }
.topbar .spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer; font-size: 16px;
  display: grid; place-items: center; transition: var(--t-fast);
}
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }
.menu-toggle { display: none; }

.content { padding: 24px 26px 60px; max-width: 1400px; width: 100%; margin: 0 auto; }

/* ---------- Buttons ------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  padding: 9px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13.5px;
  cursor: pointer; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); transition: var(--t-fast); white-space: nowrap;
}
.btn:hover { background: var(--surface-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-600); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger-soft); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 9px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- Cards -------------------------------------------------- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  transition: box-shadow var(--t), transform var(--t), border-color var(--t);
}
.card.pad { padding: 20px; }
.card-hover:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: var(--border-strong); }

.section-title { display:flex; align-items:center; gap:10px; margin: 30px 0 14px; }
.section-title h2 { font-size: 16px; }
.section-title .count { font-size:12px; color:var(--text-3); background:var(--surface-hover);
  padding:2px 9px; border-radius:999px; }
.section-title .spacer { flex:1; }

/* ---------- KPI cards --------------------------------------------- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.kpi .kpi-ic { position:absolute; right:14px; top:14px; width:40px; height:40px; border-radius:12px;
  display:grid; place-items:center; font-size:19px; }
.kpi .kpi-label { font-size: 12.5px; color: var(--text-3); font-weight: 600; }
.kpi .kpi-value { font-size: 30px; font-weight: 720; letter-spacing: -.02em; margin-top: 6px; }
.kpi .kpi-foot { font-size: 12px; color: var(--text-2); margin-top: 4px; display:flex; gap:6px; align-items:center; }
.trend-up { color: var(--success); font-weight: 700; }
.trend-down { color: var(--danger); font-weight: 700; }
.tint-accent { background: var(--accent-soft); color: var(--accent-700); }
.tint-success { background: var(--success-soft); color: var(--success); }
.tint-warning { background: var(--warning-soft); color: var(--warning); }
.tint-danger  { background: var(--danger-soft);  color: var(--danger); }
.tint-info    { background: var(--info-soft);    color: var(--info); }

/* ---------- Badges &amp; pills ---------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650;
  padding: 3px 9px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.s-planejado   { background: var(--info-soft);    color: var(--info); }
.badge.s-confirmado  { background: var(--accent-soft);  color: var(--accent-700); }
.badge.s-andamento   { background: var(--warning-soft); color: var(--warning); }
.badge.s-concluido   { background: var(--success-soft); color: var(--success); }
.badge.s-cancelado   { background: var(--surface-hover);color: var(--text-3); }
.badge.s-adiado      { background: var(--danger-soft);  color: var(--danger); }
.badge.outline { background: transparent; border-color: var(--border-strong); color: var(--text-2); }
[data-theme=&quot;dark&quot;] .badge.s-confirmado { color: var(--accent); }

.pill { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: var(--surface-hover);
  color: var(--text-2); font-weight: 600; }

.risk-alto  { color: var(--danger); }
.risk-medio { color: var(--warning); }
.risk-baixo { color: var(--success); }

/* ---------- Event cards ------------------------------------------- */
.events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.event-card { padding: 16px 16px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.event-card .ec-top { display:flex; align-items:flex-start; gap:10px; }
.event-card .ec-type {
  width: 40px; height: 40px; border-radius: 12px; display:grid; place-items:center;
  font-size: 19px; flex: 0 0 40px;
}
.event-card .ec-title { font-size: 14.5px; font-weight: 650; line-height: 1.25; }
.event-card .ec-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.event-card .ec-row { display:flex; align-items:center; gap:8px; flex-wrap: wrap; font-size:12.5px; color:var(--text-2); }
.event-card .ec-row .ic { opacity:.7; }
.ec-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
.ec-planner {
  display:flex; align-items:center; gap:8px; font-size:12px; padding:8px 10px;
  background: var(--surface-2); border:1px solid var(--border); border-radius:10px;
}
.progressbar { flex:1; height:6px; background:var(--surface-hover); border-radius:999px; overflow:hidden; }
.progressbar > span { display:block; height:100%; background:var(--success); border-radius:999px; transition: width var(--t); }

/* ---------- Countdown hero ---------------------------------------- */
.hero {
  background: linear-gradient(135deg, var(--accent-700), var(--accent));
  color: #fff; border-radius: var(--radius-lg); padding: 26px 28px;
  display: flex; align-items: center; gap: 26px; flex-wrap: wrap;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.hero::after { content:&quot;&quot;; position:absolute; right:-40px; top:-40px; width:220px; height:220px;
  background: rgba(255,255,255,.10); border-radius:50%; }
.hero .hero-label { font-size: 12px; text-transform: uppercase; letter-spacing:.09em; opacity:.85; font-weight:700; }
.hero .hero-title { font-size: 24px; font-weight: 720; margin: 6px 0; }
.hero .hero-meta  { font-size: 13px; opacity: .92; }
.countdown { display:flex; gap: 12px; margin-left:auto; z-index:1; }
.cd-box { background: rgba(255,255,255,.16); border-radius: 12px; padding: 12px 16px; text-align:center; min-width:64px; backdrop-filter: blur(4px); }
.cd-box b { font-size: 26px; font-weight: 720; display:block; line-height:1; }
.cd-box span { font-size: 10.5px; text-transform: uppercase; letter-spacing:.06em; opacity:.85; }

/* ---------- Alerts ------------------------------------------------- */
.alert { display:flex; align-items:flex-start; gap:12px; padding:13px 15px; border-radius:var(--radius-sm);
  border:1px solid var(--warning-soft); background:var(--warning-soft); color: var(--text); font-size:13px; }
.alert .ic { color: var(--warning); font-size:16px; margin-top:1px; }
.alert.info { border-color: var(--info-soft); background: var(--info-soft); }
.alert.info .ic { color: var(--info); }
.alert a { font-weight:700; color: var(--accent-700); text-decoration: underline; }

/* ---------- Toolbar / filters ------------------------------------- */
.toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.search {
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:8px 12px; min-width:230px; flex:1 1 240px; max-width: 360px;
}
.search input { border:none; background:transparent; outline:none; color:var(--text); font-size:13.5px; width:100%; }
.search .ic { color: var(--text-3); }
select, input[type=&quot;text&quot;], input[type=&quot;date&quot;], input[type=&quot;datetime-local&quot;], input[type=&quot;number&quot;],
input[type=&quot;email&quot;], input[type=&quot;url&quot;], textarea {
  font-family: inherit; font-size: 13.5px; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 9px 11px; outline: none; transition: var(--t-fast); width: 100%;
}
select:focus, input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select.compact, input.compact { width:auto; padding:8px 11px; }
textarea { resize: vertical; min-height: 78px; }
label.field { display:block; }
.field-label { font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:6px; display:flex; gap:6px; align-items:center; }
.field-hint { font-size:11.5px; color:var(--text-3); margin-top:4px; }

.segmented { display:inline-flex; background:var(--surface-hover); border-radius:11px; padding:3px; gap:2px; }
.segmented button { border:none; background:transparent; color:var(--text-2); padding:7px 13px; border-radius:9px;
  font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; transition:var(--t-fast); }
.segmented button.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); }

.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip { font-size:12px; padding:5px 11px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); cursor:pointer; color:var(--text-2); font-weight:600; transition:var(--t-fast); }
.chip.active { background:var(--accent-soft); color:var(--accent-700); border-color:var(--accent); }
[data-theme=&quot;dark&quot;] .chip.active { color: var(--accent); }

/* ---------- Table -------------------------------------------------- */
.table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
table.grid { width:100%; border-collapse: collapse; font-size:13px; min-width: 780px; }
table.grid th { text-align:left; padding:12px 14px; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--text-3); border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap; user-select:none; }
table.grid th:hover { color: var(--text); }
table.grid th .sort { opacity:.4; font-size:10px; }
table.grid td { padding:12px 14px; border-bottom:1px solid var(--border); color:var(--text-2); vertical-align:middle; }
table.grid tr:last-child td { border-bottom:none; }
table.grid tbody tr { transition:var(--t-fast); cursor:pointer; }
table.grid tbody tr:hover { background: var(--surface-hover); }
table.grid td b { color: var(--text); font-weight:600; }
.row-actions { display:flex; gap:4px; justify-content:flex-end; }
.row-actions .icon-btn { width:30px; height:30px; font-size:14px; }

/* ---------- Kanban ------------------------------------------------- */
.kanban { display:grid; grid-auto-flow:column; grid-auto-columns: minmax(260px, 1fr); gap:14px; overflow-x:auto; padding-bottom:8px; }
.kb-col { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:12px; min-height:120px; }
.kb-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-weight:650; font-size:13px; }
.kb-head .n { margin-left:auto; font-size:11.5px; color:var(--text-3); background:var(--surface-hover); padding:1px 8px; border-radius:999px; }
.kb-card { background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:12px; margin-bottom:10px;
  cursor:pointer; box-shadow:var(--shadow-sm); transition:var(--t-fast); }
.kb-card:hover { box-shadow:var(--shadow); transform: translateY(-1px); }
.kb-card .t { font-weight:600; font-size:13px; margin-bottom:6px; }

/* ---------- Calendar ---------------------------------------------- */
.cal-head { display:grid; grid-template-columns: repeat(7,1fr); gap:8px; margin-bottom:8px; }
.cal-head div { text-align:center; font-size:11.5px; font-weight:700; color:var(--text-3); text-transform:uppercase; }
.cal-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:8px; }
.cal-cell { background:var(--surface); border:1px solid var(--border); border-radius:11px; min-height:104px; padding:8px; transition:var(--t-fast); }
.cal-cell.out { opacity:.45; }
.cal-cell.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.cal-daynum { font-size:12px; font-weight:700; color:var(--text-3); margin-bottom:6px; }
.cal-cell.today .cal-daynum { color: var(--accent-700); }
.cal-ev { font-size:11px; padding:3px 7px; border-radius:7px; margin-bottom:4px; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; border-left:3px solid; }

/* ---------- Dashboard --------------------------------------------- */
.dash-grid { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px; }
.chart-card { padding:18px; display:flex; flex-direction:column; }
.chart-card .ch-head { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.chart-card .ch-head h3 { font-size:14px; }
.chart-card .ch-head .spacer { flex:1; }
.chart-holder { position:relative; flex:1; min-height:230px; }
.col-3 { grid-column: span 3; } .col-4 { grid-column: span 4; }
.col-5 { grid-column: span 5; } .col-6 { grid-column: span 6; }
.col-7 { grid-column: span 7; } .col-8 { grid-column: span 8; } .col-12 { grid-column: span 12; }
.rank-list { display:flex; flex-direction:column; gap:2px; }
.rank-row { display:flex; align-items:center; gap:12px; padding:9px 6px; border-bottom:1px solid var(--border); }
.rank-row:last-child { border-bottom:none; }
.rank-row .pos { width:22px; height:22px; border-radius:7px; background:var(--surface-hover); display:grid; place-items:center; font-weight:700; font-size:11px; flex:0 0 22px; }
.rank-row .nm { font-weight:600; color:var(--text); }
.rank-row .bar { flex:1; height:8px; background:var(--surface-hover); border-radius:999px; overflow:hidden; }
.rank-row .bar > span { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-600)); border-radius:999px; }
.rank-row .val { font-weight:700; font-size:12.5px; min-width:56px; text-align:right; }

/* ---------- Modal / drawer ---------------------------------------- */
.overlay { position:fixed; inset:0; background:rgba(15,23,42,.5); backdrop-filter:blur(3px);
  z-index:60; display:flex; opacity:0; pointer-events:none; transition:opacity var(--t); }
.overlay.open { opacity:1; pointer-events:auto; }
.drawer { margin-left:auto; width:min(720px, 100%); background:var(--surface); height:100%;
  overflow-y:auto; box-shadow:var(--shadow-lg); transform:translateX(30px); transition:transform var(--t);
  display:flex; flex-direction:column; }
.overlay.open .drawer { transform:translateX(0); }
.drawer-head { position:sticky; top:0; background:var(--surface); z-index:2; padding:18px 24px;
  border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
.drawer-head h2 { font-size:17px; }
.drawer-body { padding:22px 24px; }
.drawer-foot { position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border);
  padding:14px 24px; display:flex; gap:10px; justify-content:flex-end; }

.modal { margin:auto; width:min(440px,100%); background:var(--surface); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg); padding:24px; transform:scale(.96); transition:transform var(--t); }
.overlay.open .modal { transform:scale(1); }

/* Form layout inside drawer */
.form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
.form-grid .full { grid-column: 1 / -1; }
.form-section { margin-top:22px; }
.form-section:first-child { margin-top:0; }
.form-section > .fs-title { font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  color:var(--accent-700); margin-bottom:12px; display:flex; align-items:center; gap:8px;
  padding-bottom:8px; border-bottom:1px solid var(--border); }
[data-theme=&quot;dark&quot;] .form-section > .fs-title { color: var(--accent); }

/* KPI editor rows in results */
.kpi-row { display:grid; grid-template-columns: 1fr 90px 90px 34px; gap:8px; align-items:center; margin-bottom:8px; }

/* Detail view */
.detail-row { display:flex; gap:14px; padding:11px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
.detail-row .k { width:180px; flex:0 0 180px; color:var(--text-3); font-weight:600; }
.detail-row .v { color:var(--text); flex:1; }

/* ---------- Toast -------------------------------------------------- */
.toast-wrap { position:fixed; bottom:22px; right:22px; z-index:90; display:flex; flex-direction:column; gap:10px; }
.toast { background:var(--text); color:var(--surface); padding:12px 16px; border-radius:11px; box-shadow:var(--shadow-lg);
  font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; animation: toastIn .25s ease; max-width:340px; }
.toast.ok  { background: var(--success); color:#fff; }
.toast.err { background: var(--danger); color:#fff; }
@keyframes toastIn { from { transform: translateY(12px); opacity:0; } to { transform:none; opacity:1; } }

/* ---------- Empty state ------------------------------------------- */
.empty { text-align:center; padding:56px 20px; color:var(--text-3); }
.empty .ic { font-size:44px; opacity:.5; display:block; margin-bottom:12px; }
.empty h3 { color:var(--text-2); margin-bottom:6px; }

.spinner { width:16px; height:16px; border:2px solid var(--border-strong); border-top-color:var(--accent);
  border-radius:50%; animation: spin .7s linear infinite; display:inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Responsive -------------------------------------------- */
@media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(2,1fr); }
  .col-3,.col-4,.col-5 { grid-column: span 6; } .col-7,.col-8 { grid-column: span 12; } }
@media (max-width: 820px) {
  .sidebar { position: fixed; left:0; top:0; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .menu-toggle { display: grid; }
  .content { padding: 18px 16px 60px; }
  .form-grid { grid-template-columns: 1fr; }
  .col-6 { grid-column: span 12; }
  .countdown { margin-left:0; width:100%; }
  .detail-row { flex-direction:column; gap:2px; } .detail-row .k { width:auto; }
}
@media (max-width: 560px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .topbar { padding: 12px 16px; }
  .hero { padding: 20px; }
  .cd-box { min-width:52px; padding:9px 10px; } .cd-box b { font-size:20px; }
}

/* Scrim for mobile sidebar */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35; display:none; }
.scrim.open { display:block; }
@media (min-width: 821px) { .scrim { display:none !important; } }

/* =====================================================================
   Aba Calendário (Outlook-like): legenda, chips, mini-meses, grade de horas
   ===================================================================== */
.cal-legend { display:flex; gap:22px; flex-wrap:wrap; align-items:center; margin:2px 2px 16px; }
.cal-legend .lg-group { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.cal-legend .lg-title { font-size:11.5px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; }
.cal-legend .lg-item { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-2); }
.cal-legend .lg-dot { width:11px; height:11px; border-radius:50%; display:inline-block; }

/* chip de evento (mês) */
.cal-ev2 { display:flex; align-items:center; gap:5px; font-size:11.5px; padding:3px 7px; border-radius:7px;
  margin-bottom:4px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-weight:600; border-left:3px solid; transition:var(--t-fast); }
.cal-ev2:hover { filter:brightness(.97); transform:translateX(1px); }
.cal-ev2 b { font-weight:700; }
.cal-cell[data-date] { cursor:pointer; }
.cal-cell[data-date]:hover { background:var(--surface-hover); }

/* mini-meses (ano / trimestre) */
.mini-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
.mini-grid.quarter { grid-template-columns:repeat(3, 1fr); }
.mini-month { padding:14px; }
.mini-month .mm-title { font-weight:700; font-size:14px; margin-bottom:10px; cursor:pointer; color:var(--accent-700); }
[data-theme=&quot;dark&quot;] .mini-month .mm-title { color:var(--accent); }
.mini-month .mm-title:hover { text-decoration:underline; }
.mm-head { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px; }
.mm-head span { text-align:center; font-size:10px; color:var(--text-3); font-weight:700; }
.mm-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.mm-day { min-height:30px; border-radius:7px; padding:3px 0 2px; display:flex; flex-direction:column;
  align-items:center; gap:2px; font-size:11px; }
.mm-day.out { visibility:hidden; }
.mm-day.has { cursor:pointer; }
.mm-day.has:hover { background:var(--surface-hover); }
.mm-day.today { background:var(--accent-soft); }
.mm-day.today .mm-n { color:var(--accent-700); font-weight:800; }
.mm-n { line-height:1; color:var(--text-2); }
.mm-dots { display:flex; gap:2px; height:6px; }
.mm-dot { width:5px; height:5px; border-radius:50%; display:inline-block; }

/* grade de horários (semana / dia) */
.tg-wrap { padding:0; overflow:hidden; }
.tg-scroll { display:flex; overflow-x:auto; max-height:70vh; overflow-y:auto; }
.tg-gutter { flex:0 0 58px; position:sticky; left:0; background:var(--surface); z-index:3; }
.tg-hour { height:46px; border-top:1px solid var(--border); font-size:10.5px; color:var(--text-3); padding:2px 8px 0; text-align:right; }
.tg-cols { display:flex; flex:1; min-width:0; }
.tg-col { flex:1 1 0; min-width:110px; border-left:1px solid var(--border); }
.tg-wrap.single .tg-col { min-width:0; }
.tg-colhead { height:42px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; font-weight:600;
  color:var(--text-2); border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2; }
.tg-colhead.today { color:var(--accent-700); }
[data-theme=&quot;dark&quot;] .tg-colhead.today { color:var(--accent); }
.tg-col.today { background:color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.tg-colbody { position:relative; }
.tg-colbody .tg-slot { border-top:1px solid var(--border); cursor:pointer; transition:var(--t-fast); }
.tg-colbody .tg-slot:hover { background:var(--surface-hover); }
.tg-ev { position:absolute; border-left:3px solid; border-radius:8px; padding:4px 7px; overflow:hidden; cursor:pointer;
  box-shadow:var(--shadow-sm); font-size:11.5px; line-height:1.25; display:flex; flex-direction:column; gap:1px; }
.tg-ev:hover { box-shadow:var(--shadow); z-index:5; }
.tg-ev b { font-size:11px; font-weight:700; }
.tg-ev span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }

@media (max-width: 900px) { .mini-grid { grid-template-columns:repeat(2,1fr); } .mini-grid.quarter { grid-template-columns:1fr; } }
@media (max-width: 560px) { .mini-grid { grid-template-columns:1fr; } .cal-legend { gap:12px; } }

function fmtDateTime(iso){ const d=new Date(iso); return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function relativeDays(iso){ const d=new Date(iso); const diff=Math.round((d - NOW)/86400000);
  if(diff===0) return &quot;hoje&quot;; if(diff===1) return &quot;amanhã&quot;; if(diff>1) return `em ${diff} dias`;

function renderHome(){

  const upcoming = EVENTS.filter(e=>new Date(e.inicio)>=NOW).sort((a,b)=>new Date(a.inicio)-new Date(b.inicio));
  const emRisco = EVENTS.filter(e=>e.risco===&quot;alto&quot;||e.status===&quot;adiado&quot;||(new Date(e.inicio)<NOW&amp;&amp;![&quot;concluido&quot;,&quot;cancelado&quot;].includes(e.status)));
  const avaliados = concluidos.filter(e=>e.metaAtingida!=null);
  const sucesso = avaliados.length? avaliados.filter(e=>e.metaAtingida).length/avaliados.length*100 : null;
  const semResp = EVENTS.filter(e=>!e.responsavel &amp;&amp; new Date(e.inicio)>=NOW.setHours&amp;&amp;true).filter(e=>!e.responsavel);
  const next = upcoming[0];

  const kpis = `<div class=&quot;kpi-grid&quot;>
    ${kpiCard({label:&quot;Eventos no mês&quot;,value:thisMonth.length,icon:&quot;📆&quot;,tint:&quot;tint-info&quot;,foot:`<span>${upcoming.length} próximos no total</span>`})}
    ${kpiCard({label:&quot;Concluídos&quot;,value:concluidos.length,icon:&quot;✅&quot;,tint:&quot;tint-success&quot;,foot:`<span>de ${active.length} ativos</span>`})}
    ${kpiCard({label:&quot;Em risco / atrasados&quot;,value:emRisco.length,icon:&quot;⚠️&quot;,tint:&quot;tint-danger&quot;,foot:emRisco.length?`<span class=&quot;trend-down&quot;>requer atenção</span>`:`<span class=&quot;trend-up&quot;>tudo sob controle</span>`})}
    ${kpiCard({label:&quot;Taxa de sucesso&quot;,value:sucesso==null?&quot;—&quot;:pct(sucesso),icon:&quot;🎯&quot;,tint:&quot;tint-accent&quot;,foot:`<span>${avaliados.length} eventos avaliados</span>`})}
  </div>`;

  const alert = semResp.length? `<div class=&quot;alert&quot; style=&quot;margin-top:16px&quot;><span class=&quot;ic&quot;>⚠️</span>
    <div><b>${semResp.length}</b> evento(s) sem responsável definido. <a data-goto=&quot;eventos&quot;>Ver eventos →</a></div></div>` : &quot;&quot;;

  const hero = next? `<div class=&quot;hero&quot; style=&quot;margin-top:24px&quot;>
    <div style=&quot;z-index:1&quot;>
      <div class=&quot;hero-label&quot;>⏳ Próximo evento em destaque</div>
      <div class=&quot;hero-title&quot;>${esc(next.tema)}</div>
      <div class=&quot;hero-meta&quot;>📅 ${fmtDateTime(next.inicio)} &amp;nbsp;·&amp;nbsp; 👤 ${esc(next.responsavel||&quot;sem responsável&quot;)}</div>
    </div>
    <div class=&quot;countdown&quot; id=&quot;cd&quot;></div></div>` : &quot;&quot;;

  const win = homeWindow;
  const inWin = e => { const diff=(new Date(e.inicio)-NOW)/86400000; return diff>=0 &amp;&amp; diff<=win; };
  const shown = upcoming.filter(inWin);
  const grid = shown.length
    ? `<div class=&quot;events-grid&quot;>${shown.map(eventCardHtml).join(&quot;&quot;)}</div>`
    : emptyState(&quot;🗓️&quot;,&quot;Nenhum evento no período&quot;,&quot;Ajuste o filtro de dias ou crie um novo evento.&quot;);

  const section = `<div class=&quot;section-title&quot; style=&quot;margin-top:26px&quot;>
    <h2>Próximos eventos</h2><span class=&quot;count&quot;>${shown.length}</span><div class=&quot;spacer&quot;></div>
    <div class=&quot;segmented&quot; id=&quot;winSeg&quot;>
      ${[30,60,90].map(d=>`<button data-w=&quot;${d}&quot; class=&quot;${d===win?'active':''}&quot;>${d} dias</button>`).join(&quot;&quot;)}
      <button data-w=&quot;9999&quot; class=&quot;${win===9999?'active':''}&quot;>Todos</button>
    </div></div>`;

  return kpis + alert + hero + section + grid;
}
function startCountdown(){
  const el = document.getElementById(&quot;cd&quot;); if(!el) return;
  const up = EVENTS.filter(e=>new Date(e.inicio)>=NOW).sort((a,b)=>new Date(a.inicio)-new Date(b.inicio))[0];
  if(!up) return;
  const target = new Date(up.inicio);
  const box=(v,l)=>`<div class=&quot;cd-box&quot;><b>${p2(v)}</b><span>${l}</span></div>`;
  function tick(){
    let diff = Math.max(0,(target - new Date())/1000);
    const d=Math.floor(diff/86400); diff-=d*86400;
    const h=Math.floor(diff/3600); diff-=h*3600;
    const m=Math.floor(diff/60); const s=Math.floor(diff-m*60);
    el.innerHTML = box(d,&quot;dias&quot;)+box(h,&quot;horas&quot;)+box(m,&quot;min&quot;)+box(s,&quot;seg&quot;);
  }
  tick(); clearInterval(window._cd); window._cd=setInterval(tick,1000);
}

/* ---------- CALENDÁRIO (mês) ---------- */
function monthGridCard(y,m,events){
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const byDay = {};
  events.forEach(e=>{const d=new Date(e.inicio); if(d.getMonth()===m&amp;&amp;d.getFullYear()===y)(byDay[d.getDate()]=byDay[d.getDate()]||[]).push(e);});
  let cells=&quot;&quot;;
  for(let i=0;i<first;i++) cells+=`<div class=&quot;cal-cell out&quot;></div>`;
  for(let d=1;d<=days;d++){
    const isToday = (y===NOW.getFullYear()&amp;&amp;m===NOW.getMonth()&amp;&amp;d===NOW.getDate());
    const evs = byDay[d]||[];
    cells += `<div class=&quot;cal-cell ${isToday?'today':''}&quot;><div class=&quot;cal-daynum&quot;>${d}</div>
      ${evs.slice(0,3).map(e=>`<div class=&quot;cal-ev&quot; data-id=&quot;${e.id}&quot; style=&quot;border-left-color:${STATUS[e.status].color};background:${STATUS[e.status].color}1a;color:${STATUS[e.status].color}&quot;>${CATEGORIAS[e.categoria].icon} ${esc(e.tema)}</div>`).join(&quot;&quot;)}
      ${evs.length>3?`<div style=&quot;font-size:11px;color:var(--text-3)&quot;>+${evs.length-3} mais</div>`:&quot;&quot;}</div>`;
  }
  return `<div class=&quot;card pad&quot;>
    <div style=&quot;display:flex;align-items:center;gap:12px;margin-bottom:16px&quot;>
      <button class=&quot;icon-btn&quot; id=&quot;prevM&quot;>‹</button>
      <h2 style=&quot;font-size:17px&quot;>${MESES[m]} ${y}</h2>
      <button class=&quot;icon-btn&quot; id=&quot;nextM&quot;>›</button>
      <div class=&quot;spacer&quot; style=&quot;flex:1&quot;></div>
    </div>
    <div class=&quot;cal-head&quot;>${WD.map(d=>`<div>${d}</div>`).join(&quot;&quot;)}</div>
    <div class=&quot;cal-grid&quot;>${cells}</div></div>`;
}
function renderCalendario(){
  return monthGridCard(calState.y, calState.m, EVENTS);
}

  const custoTotal = EVENTS.reduce((s,e)=>s+(e.custoReal||0),0);
  const orcTotal = EVENTS.reduce((s,e)=>s+(e.orcamentoPrevisto||0),0);
  const partReais = concl.reduce((s,e)=>s+(e.participantesReais||0),0);
  const kpis = `<div class=&quot;kpi-grid&quot;>

    ${kpiCard({label:&quot;Orçamento vs Real&quot;,value:money(custoTotal),icon:&quot;💰&quot;,tint:&quot;tint-accent&quot;,foot:`<span>previsto ${money(orcTotal)}</span>`})}
    ${kpiCard({label:&quot;Público alcançado&quot;,value:num(partReais),icon:&quot;👥&quot;,tint:&quot;tint-warning&quot;,foot:`<span>participantes reais</span>`})}
  </div>`;
  const cc=(t,col,id)=>`<div class=&quot;card chart-card ${col}&quot;><div class=&quot;ch-head&quot;><h3>${t}</h3><div class=&quot;spacer&quot;></div></div><div class=&quot;chart-holder&quot;><canvas id=&quot;${id}&quot;></canvas></div></div>`;
  const grid = `<div class=&quot;dash-grid&quot; style=&quot;margin-top:18px&quot;>
    ${cc(&quot;Realizado × Planejado&quot;,&quot;col-8&quot;,&quot;cLine&quot;)}
    ${cc(&quot;Status geral&quot;,&quot;col-4&quot;,&quot;cStatus&quot;)}
    ${cc(&quot;Distribuição por categoria&quot;,&quot;col-4&quot;,&quot;cCat&quot;)}
    ${cc(&quot;Interno × Externo / Formato&quot;,&quot;col-4&quot;,&quot;cAmb&quot;)}
    ${cc(&quot;Orçamento previsto × realizado&quot;,&quot;col-4&quot;,&quot;cBudget&quot;)}
    <div class=&quot;card chart-card col-6&quot;><div class=&quot;ch-head&quot;><h3>🏆 Ranking de responsáveis</h3></div><div class=&quot;rank-list&quot; id=&quot;rankList&quot;></div></div>
    <div class=&quot;card chart-card col-6&quot;><div class=&quot;ch-head&quot;><h3>📊 Eventos por mês</h3></div><div class=&quot;chart-holder&quot;><canvas id=&quot;cCompare&quot;></canvas></div></div>
  </div>`;
  return kpis + grid;
}
function themeColors(){
  const dark = document.documentElement.getAttribute(&quot;data-theme&quot;)===&quot;dark&quot;;
  return { text: dark?&quot;#a3b0c7&quot;:&quot;#475569&quot;, grid: dark?&quot;rgba(255,255,255,.07)&quot;:&quot;rgba(71,85,105,.07)&quot;, accent:&quot;#f97316&quot; };
}
function initCharts(){
  if(typeof Chart===&quot;undefined&quot;) return;
  const tc = themeColors();
  Chart.defaults.color = tc.text; Chart.defaults.font.family = &quot;Segoe UI, sans-serif&quot;;
  const co={responsive:true,maintainAspectRatio:false};
  const months=[&quot;Fev&quot;,&quot;Mar&quot;,&quot;Abr&quot;,&quot;Mai&quot;,&quot;Jun&quot;,&quot;Jul&quot;];
  // line
  charts.push(new Chart(document.getElementById(&quot;cLine&quot;),{type:&quot;line&quot;,data:{labels:months,
    datasets:[{label:&quot;Planejados&quot;,data:[2,3,2,3,4,5],borderColor:tc.accent,backgroundColor:&quot;rgba(249,115,22,.15)&quot;,fill:true,tension:.35},
    {label:&quot;Concluídos&quot;,data:[2,2,2,3,3,1],borderColor:&quot;#16a34a&quot;,backgroundColor:&quot;transparent&quot;,tension:.35}]},
    options:{...co,scales:{y:{grid:{color:tc.grid},beginAtZero:true},x:{grid:{display:false}}}}}));
  // status doughnut
  const byStatus = STATUS_ORDER.map(s=>EVENTS.filter(e=>e.status===s).length);
  charts.push(new Chart(document.getElementById(&quot;cStatus&quot;),{type:&quot;doughnut&quot;,data:{labels:STATUS_ORDER.map(s=>STATUS[s].label),
    datasets:[{data:byStatus,backgroundColor:STATUS_ORDER.map(s=>STATUS[s].color),borderWidth:0}]},
    options:{...co,cutout:&quot;62%&quot;,plugins:{legend:{position:&quot;bottom&quot;,labels:{boxWidth:10,font:{size:11}}}}}}));
  // categoria horizontal bar
  const catKeys=Object.keys(CATEGORIAS).filter(k=>EVENTS.some(e=>e.categoria===k));
  charts.push(new Chart(document.getElementById(&quot;cCat&quot;),{type:&quot;bar&quot;,data:{labels:catKeys.map(k=>CATEGORIAS[k].label),
    datasets:[{label:&quot;Eventos&quot;,data:catKeys.map(k=>EVENTS.filter(e=>e.categoria===k).length),backgroundColor:catKeys.map(k=>CATEGORIAS[k].color),borderRadius:6}]},
    options:{...co,indexAxis:&quot;y&quot;,plugins:{legend:{display:false}},scales:{x:{grid:{color:tc.grid},beginAtZero:true},y:{grid:{display:false}}}}}));
  // formato stacked
  charts.push(new Chart(document.getElementById(&quot;cAmb&quot;),{type:&quot;bar&quot;,data:{labels:[&quot;Interno&quot;,&quot;Externo&quot;],
    datasets:Object.keys(FORMATOS).map((f,i)=>({label:FORMATOS[f].label,
      data:[&quot;interno&quot;,&quot;externo&quot;].map(a=>EVENTS.filter(e=>e.ambito===a&amp;&amp;e.formato===f).length),
      backgroundColor:[tc.accent,&quot;#2563eb&quot;,&quot;#7c3aed&quot;][i]}))},
    options:{...co,scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,grid:{color:tc.grid},beginAtZero:true}}}}));
  // budget
  charts.push(new Chart(document.getElementById(&quot;cBudget&quot;),{type:&quot;bar&quot;,data:{labels:months,
    datasets:[{label:&quot;Previsto&quot;,data:[60,22,15,60,10,205].map(x=>x*1000),backgroundColor:&quot;#94a3b8&quot;},
    {label:&quot;Realizado&quot;,data:[57,24.8,0,0,15.6,1.2].map(x=>x*1000),backgroundColor:tc.accent}]},
    options:{...co,scales:{y:{grid:{color:tc.grid},beginAtZero:true,ticks:{callback:v=>&quot;R$ &quot;+(v/1000)+&quot;k&quot;}},x:{grid:{display:false}}}}}));
  // compare bar
  charts.push(new Chart(document.getElementById(&quot;cCompare&quot;),{type:&quot;bar&quot;,data:{labels:months,
    datasets:[{label:&quot;Eventos&quot;,data:[1,1,1,1,2,5],backgroundColor:tc.accent,borderRadius:6}]},
    options:{...co,plugins:{legend:{display:false}},scales:{y:{grid:{color:tc.grid},beginAtZero:true},x:{grid:{display:false}}}}}));
  // ranking
  const resp={}; EVENTS.forEach(e=>{if(e.responsavel)resp[e.responsavel]=(resp[e.responsavel]||0)+1;});
  const ranked=Object.entries(resp).sort((a,b)=>b[1]-a[1]); const maxN=Math.max(...ranked.map(r=>r[1]));
  document.getElementById(&quot;rankList&quot;).innerHTML = ranked.map(([r,n],i)=>`<div class=&quot;rank-row&quot;>
    <div class=&quot;pos&quot;>${i+1}</div>
    <div class=&quot;nm&quot; style=&quot;flex:0 0 150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis&quot;>${esc(r)}</div>
    <div class=&quot;bar&quot;><span style=&quot;width:${n/maxN*100}%&quot;></span></div>
    <div class=&quot;val&quot;>${n} ev.</div></div>`).join(&quot;&quot;);
}

/* =====================================================================

function toast(msg,cls=&quot;&quot;){
  const w=document.getElementById(&quot;toasts&quot;);
  const t=document.createElement(&quot;div&quot;); t.className=&quot;toast &quot;+cls; t.innerHTML=`<span>✅</span> ${esc(msg)}`;
  w.appendChild(t); setTimeout(()=>t.remove(),2800);
}
function openEvent(id){
  const e=EVENTS.find(x=>x.id==id); if(!e) return;

  </div>`;
  ov.classList.add(&quot;open&quot;);
}
function closeOverlay(){ const ov=document.getElementById(&quot;overlay&quot;); ov.classList.remove(&quot;open&quot;); }

document.addEventListener(&quot;click&quot;,e=>{
  const nav=e.target.closest(&quot;.nav-item&quot;); if(nav){ e.preventDefault(); go(nav.dataset.route); return; }
  const gt=e.target.closest(&quot;[data-goto]&quot;); if(gt){ go(gt.dataset.goto); return; }
  const seg=e.target.closest(&quot;#winSeg button&quot;); if(seg){ homeWindow=+seg.dataset.w; go(&quot;home&quot;); return; }
  const mode=e.target.closest(&quot;#modeSeg button&quot;); if(mode){ listState.mode=mode.dataset.m; go(&quot;eventos&quot;); return; }
  if(e.target.closest(&quot;#prevM&quot;)){ calState.m--; if(calState.m<0){calState.m=11;calState.y--;} go(document.querySelector('.nav-item.active').dataset.route); return; }
  if(e.target.closest(&quot;#nextM&quot;)){ calState.m++; if(calState.m>11){calState.m=0;calState.y++;} go(document.querySelector('.nav-item.active').dataset.route); return; }
  const vid=e.target.closest(&quot;[data-view-id]&quot;); if(vid){ openEvent(vid.dataset.viewId); return; }
  const row=e.target.closest(&quot;tr[data-id]&quot;); if(row){ openEvent(row.dataset.id); return; }

  if(e.target.closest(&quot;[data-close]&quot;)||e.target.id===&quot;overlay&quot;){ closeOverlay(); return; }
  if(e.target.closest(&quot;#newEventBtn&quot;)){ go(&quot;novo&quot;); return; }

  if(e.target.closest(&quot;#themeToggle&quot;)){ const r=document.documentElement; const dark=r.getAttribute(&quot;data-theme&quot;)===&quot;dark&quot;; r.setAttribute(&quot;data-theme&quot;,dark?&quot;light&quot;:&quot;dark&quot;); e.target.closest(&quot;#themeToggle&quot;).textContent=dark?&quot;🌙&quot;:&quot;☀️&quot;; if(document.querySelector('.nav-item.active').dataset.route===&quot;dashboard&quot;) go(&quot;dashboard&quot;); return; }
});
document.addEventListener(&quot;input&quot;,e=>{
  if(e.target.id===&quot;q&quot;){ listState.text=e.target.value; refreshEventos(); }
});
document.addEventListener(&quot;change&quot;,e=>{
  if(e.target.id===&quot;fStatus&quot;){ listState.status=e.target.value; refreshEventos(); }
  if(e.target.id===&quot;fCat&quot;){ listState.categoria=e.target.value; refreshEventos(); }

document.addEventListener(&quot;submit&quot;,e=>{

// preserva foco no campo de busca ao refiltrar a lista
function refreshEventos(){
