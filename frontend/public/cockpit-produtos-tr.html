#dashboardScreen {
    flex-direction: column;
    min-height: 100vh;
}

.main-header {
    background: var(--white);
    padding: 16px 24px;
    box-shadow: var(--shadow-md);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.header-left h1 {
    font-size: 20px;
    color: var(--tr-blue);
}

.header-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.user-info {
    font-size: 14px;
    color: var(--gray-700);
    font-weight: 500;
}

.dashboard-container {
    display: flex;
    flex: 1;
    background: var(--gray-50);
}

/* ===== SIDEBAR ===== */
.sidebar {
    width: 280px;
    background: var(--white);
    padding: 24px;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: 24px;
}

.nav-menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: var(--transition);
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-700);
    text-align: left;
}

.nav-item:hover {
    background: var(--gray-100);
}

.nav-item.active {
    background: linear-gradient(135deg, var(--tr-orange) 0%, var(--tr-orange-dark) 100%);
    color: var(--white);
    box-shadow: var(--shadow-md);
}

.nav-icon {
    font-size: 20px;
}

.stats-card {
    background: linear-gradient(135deg, var(--tr-blue) 0%, var(--tr-blue-light) 100%);
    color: var(--white);
    padding: 20px;
    border-radius: 12px;
    box-shadow: var(--shadow-md);
}

.stats-card h3 {
    font-size: 16px;
    margin-bottom: 16px;
    opacity: 0.9;
}

.stat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
}

.stat-item:last-child {
    border-bottom: none;
}

.stat-item span {
    font-size: 12px;
    opacity: 0.9;
}

.stat-item strong {
    font-size: 20px;
    font-weight: 700;
}

/* ===== CONTEÚDO PRINCIPAL ===== */
.main-content {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
}

.content-section {
    display: none;
}

.content-section.active {
    display: block;
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.section-header h2 {
    font-size: 24px;
    color: var(--tr-blue);
}

.filters-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.filters-bar input,
.filters-bar select {
    padding: 10px 16px;
    border: 2px solid var(--gray-200);
    border-radius: 8px;
    font-size: 14px;
    transition: var(--transition);
}

.filters-bar input {
    flex: 1;
    min-width: 250px;
}

.filters-bar select {
    min-width: 180px;
}

/* ===== TABELAS ===== */
.table-container {
    background: var(--white);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
}

.data-table thead {
    background: linear-gradient(135deg, var(--tr-blue) 0%, var(--tr-blue-light) 100%);
    color: var(--white);
}

.data-table th {
    padding: 16px;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.data-table tbody tr {
    border-bottom: 1px solid var(--gray-200);
    transition: var(--transition);
}

.data-table tbody tr:hover {
    background: var(--gray-50);
}

.data-table tbody tr:nth-child(even) {
    background: var(--gray-50);
}

.data-table tbody tr:nth-child(even):hover {
    background: var(--gray-100);
}

.data-table td {
    padding: 14px 16px;
    font-size: 14px;
    color: var(--gray-700);
}

.status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
}

.status-badge.agendada {
    background: #DBEAFE;
    color: #1E40AF;
}

.status-badge.realizada {
    background: #D1FAE5;
    color: #065F46;
}

.status-badge.cancelada {
    background: #FEE2E2;
    color: #991B1B;
}

.action-buttons {
    display: flex;
    gap: 8px;
}

.btn-icon {
    padding: 6px 10px;
    background: transparent;
    border: 1px solid var(--gray-300);
    border-radius: 6px;
    cursor: pointer;
    transition: var(--transition);
    font-size: 14px;
}

.btn-icon:hover {
    background: var(--gray-100);
    border-color: var(--gray-400);
}

.btn-icon.edit:hover {
    background: #DBEAFE;
    border-color: #3B82F6;
    color: #1E40AF;
}

.btn-icon.delete:hover {
    background: #FEE2E2;
    border-color: #EF4444;
    color: #991B1B;
}

/* ===== CONSULTORES GRID ===== */
.consultores-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

.consultor-card {
    background: var(--white);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow-md);
    transition: var(--transition);
    border-top: 4px solid var(--tr-orange);
}

.consultor-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}

.consultor-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 16px;
}

.consultor-avatar {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, var(--tr-orange) 0%, var(--tr-orange-dark) 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-size: 20px;
    font-weight: 700;
}

.consultor-status {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
}

.consultor-status.ativo {
    background: #D1FAE5;
    color: #065F46;
}

.consultor-status.inativo {
    background: #F3F4F6;
    color: #6B7280;
}

.consultor-info h3 {
    font-size: 18px;
    color: var(--tr-blue);
    margin-bottom: 4px;
}

.consultor-info p {
    font-size: 13px;
    color: var(--gray-600);
    margin-bottom: 2px;
}

.consultor-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--gray-200);
}

.consultor-stat {
    text-align: center;
}

.consultor-stat strong {
    display: block;
    font-size: 24px;
    color: var(--tr-orange);
    margin-bottom: 4px;
}

.consultor-stat span {
    font-size: 12px;
    color: var(--gray-600);
}

.consultor-actions {
    margin-top: 16px;
    display: flex;
    gap: 8px;
}

.consultor-actions button {
    flex: 1;
}

/* ===== TEMAS LIST ===== */
.temas-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.tema-item {
    background: var(--white);
    border-radius: 10px;
    padding: 20px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 16px;
    transition: var(--transition);
    border-left: 4px solid var(--tr-orange);
}

.tema-item:hover {
    box-shadow: var(--shadow-md);
}

.tema-color {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    flex-shrink: 0;
}

.tema-info {
    flex: 1;
}

.tema-info h3 {
    font-size: 16px;
    color: var(--tr-blue);
    margin-bottom: 4px;
}

.tema-info p {
    font-size: 13px;
    color: var(--gray-600);
}

.tema-count {
    background: var(--gray-100);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
}

/* ===== CHARTS ===== */
.charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
}

.chart-card {
    background: var(--white);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow-md);
}

.chart-card h3 {
    font-size: 16px;
    color: var(--tr-blue);
    margin-bottom: 20px;
}

/* ===== MODAIS ===== */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    backdrop-filter: blur(4px);
}

.modal.active {
    display: flex;
    animation: fadeIn 0.3s ease;
}

.modal-content {
    background: var(--white);
    border-radius: 16px;
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-xl);
    animation: slideUp 0.4s ease;
}

.modal-large {
    max-width: 900px;
}

@keyframes slideUp {
    from {
        transform: translateY(30px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.modal-header {
    padding: 24px;
    border-bottom: 2px solid var(--gray-200);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    font-size: 20px;
    color: var(--tr-blue);
}

.btn-close {
    background: transparent;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--gray-500);
    transition: var(--transition);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
}

.btn-close:hover {
    background: var(--gray-100);
    color: var(--gray-700);
}

.modal-body {
    padding: 24px;
}

.modal-footer {
    padding: 16px 24px;
    border-top: 2px solid var(--gray-200);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-grid .input-group.full-width {
    grid-column: 1 / -1;
}

/* ===== TABS ===== */
.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--gray-200);
    overflow-x: auto;
}

.tab-btn {
    padding: 12px 20px;
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-600);
    transition: var(--transition);
    white-space: nowrap;
}

.tab-btn:hover {
    color: var(--tr-orange);
}

.tab-btn.active {
    color: var(--tr-orange);
    border-bottom-color: var(--tr-orange);
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
    animation: fadeIn 0.3s ease;
}

/* ===== PARTICIPANTES ===== */
.participant-header {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: end;
}

.participant-limit {
    background: var(--gray-100);
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    text-align: center;
    font-size: 14px;
}

.participants-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
}

.participant-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background: var(--gray-50);
    border-radius: 8px;
    border-left: 3px solid var(--tr-orange);
}

.participant-info strong {
    display: block;
    color: var(--gray-900);
    font-size: 14px;
}

.participant-info span {
    color: var(--gray-600);
    font-size: 12px;
}

/* ===== ROADMAP ===== */
.roadmap-header {
    margin-bottom: 16px;
}

.view-toggle {
    display: flex;
    gap: 8px;
    background: var(--gray-100);
    padding: 4px;
    border-radius: 8px;
}

.toggle-btn {
    padding: 8px 16px;
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-700);
    transition: var(--transition);
}

.toggle-btn:hover {
    background: var(--gray-200);
}

.toggle-btn.active {
    background: var(--white);
    color: var(--tr-orange);
    box-shadow: var(--shadow-sm);
}

.roadmap-view {
    display: none;
}

.roadmap-view.active {
    display: block;
    animation: fadeIn 0.3s ease;
}

.roadmap-main-view {
    display: none;
}

.roadmap-main-view.active {
    display: block;
    animation: fadeIn 0.3s ease;
}

.agenda-roadmap-list,
.roadmap-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* ===== ROADMAP KANBAN (VISUAL FODA) ===== */
.roadmap-kanban {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.kanban-column {
    flex: 0 0 320px;
    background: var(--gray-50);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow-md);
    border-top: 4px solid var(--tr-orange);
    display: flex;
    flex-direction: column;
}

.kanban-column-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--gray-200);
}

.kanban-product-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 16px;
    box-shadow: var(--shadow-sm);
}

.kanban-product-info h3 {
    font-size: 15px;
    color: var(--tr-blue);
    margin-bottom: 2px;
}

.kanban-product-info span {
    font-size: 12px;
    color: var(--gray-600);
}

.kanban-items {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    max-height: 500px;
    padding-right: 4px;
}

.kanban-items::-webkit-scrollbar {
    width: 6px;
}

.kanban-items::-webkit-scrollbar-track {
    background: transparent;
}

.kanban-items::-webkit-scrollbar-thumb {
    background: var(--gray-300);
    border-radius: 3px;
}

.kanban-items::-webkit-scrollbar-thumb:hover {
    background: var(--gray-400);
}

.kanban-item {
    background: var(--white);
    border-radius: 8px;
    padding: 12px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: var(--transition);
    border: 2px solid transparent;
    position: relative;
}

.kanban-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--tr-orange);
}

.kanban-item.selected {
    border-color: #10B981;
    background: #ECFDF5;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    animation: pulseGreen 2s infinite;
}

@keyframes pulseGreen {
    0%, 100% {
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }
    50% {
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.2);
    }
}

.kanban-item.selected::before {
    content: '✓';
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    background: #10B981;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    animation: checkPop 0.3s ease;
}

@keyframes checkPop {
    0% {
        transform: scale(0);
        opacity: 0;
    }
    50% {
        transform: scale(1.2);
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

.kanban-item h4 {
    font-size: 14px;
    color: var(--gray-900);
    margin-bottom: 6px;
    padding-right: 30px;
    line-height: 1.3;
}

.kanban-item p {
    font-size: 12px;
    color: var(--gray-600);
    line-height: 1.4;
    margin-bottom: 8px;
}

.kanban-item-badges {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}

.kanban-item-badges .badge {
    font-size: 10px;
    padding: 3px 8px;
}

.kanban-empty {
    text-align: center;
    color: var(--gray-400);
    font-size: 13px;
    padding: 40px 20px;
    background: var(--white);
    border-radius: 8px;
    border: 2px dashed var(--gray-300);
}

.kanban-summary {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 2px solid var(--gray-200);
    text-align: center;
    font-size: 12px;
    color: var(--gray-600);
}

.kanban-summary strong {
    color: var(--tr-orange);
    font-size: 18px;
    display: block;
    margin-bottom: 4px;
}

/* ===== TIMELINE VISUAL (LINHA DO TEMPO) ===== */
.roadmap-timeline {
    padding: 20px 0;
}

.timeline-counter {
    position: sticky;
    top: 0;
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    color: white;
    padding: 16px 20px;
    border-radius: 10px;
    margin-bottom: 30px;
    text-align: center;
    box-shadow: var(--shadow-lg);
    z-index: 10;
}

.timeline-counter-value {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 4px;
}

.timeline-counter-label {
    font-size: 14px;
    opacity: 0.95;
}

.timeline-counter-hint {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 8px;
}

.timeline-section {
    margin-bottom: 40px;
}

.timeline-section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 3px solid var(--gray-200);
}

.timeline-status-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: var(--shadow-md);
}

.timeline-status-icon.planejado {
    background: linear-gradient(135deg, #DBEAFE, #BFDBFE);
}

.timeline-status-icon.desenvolvimento {
    background: linear-gradient(135deg, #FEF3C7, #FDE68A);
}

.timeline-status-icon.concluido {
    background: linear-gradient(135deg, #D1FAE5, #A7F3D0);
}

.timeline-section-info h3 {
    font-size: 20px;
    color: var(--tr-blue);
    margin-bottom: 4px;
}

.timeline-section-info span {
    font-size: 14px;
    color: var(--gray-600);
}

.timeline-items {
    position: relative;
    padding-left: 40px;
}

.timeline-items::before {
    content: '';
    position: absolute;
    left: 23px;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--gray-300) 0%, transparent 100%);
}

.timeline-item {
    position: relative;
    margin-bottom: 24px;
    background: var(--white);
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: var(--shadow-md);
    border-left: 4px solid var(--gray-300);
    cursor: pointer;
    transition: var(--transition);
}

.timeline-item::before {
    content: '';
    position: absolute;
    left: -43px;
    top: 20px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--white);
    border: 3px solid var(--gray-400);
    box-shadow: 0 0 0 4px var(--white);
    transition: var(--transition);
}

.timeline-item:hover {
    transform: translateX(8px);
    box-shadow: var(--shadow-lg);
    border-left-color: var(--tr-orange);
}

.timeline-item:hover::before {
    border-color: var(--tr-orange);
    transform: scale(1.3);
}

.timeline-item.selected {
    border-left-color: #10B981;
    background: #ECFDF5;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
}

.timeline-item.selected::before {
    border-color: #10B981;
    background: #10B981;
    animation: pulseDot 2s infinite;
}

@keyframes pulseDot {
    0%, 100% {
        box-shadow: 0 0 0 4px var(--white), 0 0 0 8px rgba(16, 185, 129, 0.2);
    }
    50% {
        box-shadow: 0 0 0 4px var(--white), 0 0 0 12px rgba(16, 185, 129, 0.4);
    }
}

.timeline-item-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 12px;
}

.timeline-item-title {
    flex: 1;
    padding-right: 16px;
}

.timeline-item-title h4 {
    font-size: 16px;
    color: var(--gray-900);
    margin-bottom: 6px;
    line-height: 1.4;
}

.timeline-item-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}

.timeline-product-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: white;
}

.timeline-product-icon {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    background: rgba(255, 255, 255, 0.3);
}

.timeline-item-description {
    font-size: 13px;
    color: var(--gray-600);
    line-height: 1.5;
    margin-bottom: 12px;
}

.timeline-item-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.timeline-date {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--gray-600);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--gray-200);
}

.timeline-date strong {
    color: var(--tr-orange);
}

.timeline-check {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 28px;
    height: 28px;
    background: #10B981;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 16px;
    animation: checkPop 0.3s ease;
}

.timeline-item.selected .timeline-check {
    display: flex;
}

.timeline-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray-400);
}

.timeline-empty-icon {
    font-size: 64px;
    margin-bottom: 16px;
    opacity: 0.5;
}

.timeline-empty-text {
    font-size: 16px;
    color: var(--gray-500);
}

.roadmap-item {
    background: var(--white);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
    border-left: 4px solid var(--tr-orange);
    transition: var(--transition);
}

.roadmap-item:hover {
    box-shadow: var(--shadow-md);
}

.roadmap-header-info {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 8px;
}

.roadmap-item h4 {
    font-size: 15px;
    color: var(--tr-blue);
    margin-bottom: 4px;
}

.roadmap-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
}

.badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
}

.badge.produto {
    background: #E0F2FE;
    color: #075985;
}

.badge.prioridade {
    background: #FEF3C7;
    color: #92400E;
}

.badge.prioridade.alta {
    background: #FEE2E2;
    color: #991B1B;
}

.badge.receita {
    background: #FECACA;
    color: #7F1D1D;
}

.badge.status {
    background: #D1FAE5;
    color: #065F46;
}

/* ===== POSTS ===== */
.posts-control {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.post-item {
    padding: 16px;
    background: var(--gray-50);
    border-radius: 8px;
    border: 2px solid var(--gray-200);
}

.checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.checkbox-group input[type=&quot;checkbox&quot;] {
    width: 20px;
    height: 20px;
    cursor: pointer;
}

.checkbox-group label {
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
}

.reason-group {
    margin-top: 12px;
    padding-left: 30px;
}

.reason-group label {
    display: block;
    font-size: 13px;
    color: var(--gray-600);
    margin-bottom: 6px;
}

.reason-group textarea {
    width: 100%;
    padding: 10px;
    border: 2px solid var(--gray-300);
    border-radius: 6px;
    font-size: 13px;
    resize: vertical;
}

.char-counter {
    display: block;
    text-align: right;
    color: var(--gray-500);
    font-size: 12px;
    margin-top: 4px;
}

/* ===== PRODUTOS ===== */
.produtos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.produto-card {
    background: var(--white);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow-md);
    transition: var(--transition);
    border-top: 4px solid var(--tr-orange);
}

.produto-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}

.produto-header {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
}

.produto-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    flex-shrink: 0;
}

.produto-info h3 {
    font-size: 16px;
    color: var(--tr-blue);
    margin-bottom: 4px;
}

.produto-info p {
    font-size: 12px;
    color: var(--gray-600);
}

.produto-stats {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--gray-200);
    font-size: 13px;
    color: var(--gray-700);
}

/* ===== POST INDICATORS ===== */
.post-indicators {
    display: flex;
    gap: 6px;
}

.post-indicator {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
}

.post-indicator.done {
    background: #D1FAE5;
    color: #065F46;
}

.post-indicator.pending {
    background: #FEE2E2;
    color: #991B1B;
}

/* ===== RESPONSIVO ===== */
@media (max-width: 1024px) {
    .sidebar {
        width: 240px;
    }

    .charts-grid {
        grid-template-columns: 1fr;
    }

    .modal-large {
        max-width: 95%;
    }
}

@media (max-width: 768px) {
    .dashboard-container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
    }

    .stats-card {
        display: none;
    }

    .consultores-grid,
    .produtos-grid {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .filters-bar {
        flex-direction: column;
    }

    .filters-bar input,
    .filters-bar select {
        width: 100%;
        min-width: 100%;
    }

    .table-container {
        overflow-x: auto;
    }

    .tabs {
        overflow-x: auto;
    }

    .participant-header {
        flex-direction: column;
        align-items: stretch;
    }

    .participant-header button {
        margin-top: 0 !important;
    }

    .roadmap-kanban {
        flex-direction: column;
    }

    .kanban-column {
        flex: 1 1 auto;
        width: 100%;
    }

    .section-header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
    }

    .section-header > div {
        width: 100%;
    }

    .section-header button {
        width: 100%;
    }

    .view-toggle {
        width: 100%;
        flex-direction: column;
    }

    .toggle-btn {
        width: 100%;
        text-align: center;
    }

    .timeline-items {
        padding-left: 20px;
    }

    .timeline-items::before {
        left: 11px;
    }

    .timeline-item::before {
        left: -23px;
    }

    .timeline-item {
        padding: 12px 16px;
    }

    .timeline-check {
        position: static;
        margin-top: 8px;
    }
}

  <style>
    .mock-ribbon{background:#FF8000;color:#fff;font-size:12.5px;font-weight:600;
      padding:7px 16px;display:flex;align-items:center;gap:10px;justify-content:center}
    .mock-ribbon a{color:#fff;text-decoration:underline;font-weight:700}
  </style>
</head>
<body>
  <div class=&quot;mock-ribbon&quot;>
    🎨 Mockup navegável com dados fictícios — réplica fiel do sistema em produção ·
    <a href=&quot;javascript:void(parent.postMessage({go:'cockpit'},'*'))&quot;>← Voltar ao Cockpit</a>
  </div>

  <!-- Dashboard Principal (login ignorado no mockup) -->
  <div id=&quot;dashboardScreen&quot; class=&quot;screen active&quot;>
    <header class=&quot;main-header&quot;>
      <div class=&quot;header-left&quot;>
        <svg width=&quot;40&quot; height=&quot;40&quot; viewBox=&quot;0 0 60 60&quot;>
          <rect width=&quot;60&quot; height=&quot;60&quot; fill=&quot;#FF8000&quot; rx=&quot;8&quot;/>
          <text x=&quot;30&quot; y=&quot;40&quot; font-family=&quot;Arial&quot; font-size=&quot;32&quot; font-weight=&quot;bold&quot; fill=&quot;white&quot; text-anchor=&quot;middle&quot;>TR</text>
        </svg>
        <h1>Painel de Consultorias TR</h1>
      </div>
      <div class=&quot;header-right&quot;>
        <span class=&quot;user-info&quot;>👤 <span id=&quot;currentUser&quot;>Jorge Campos</span></span>
        <button onclick=&quot;alert('Mockup — logout desativado.')&quot; class=&quot;btn-secondary&quot;>Sair</button>
      </div>
    </header>

    <div class=&quot;dashboard-container&quot;>
      <aside class=&quot;sidebar&quot;>
        <nav class=&quot;nav-menu&quot;>
          <button class=&quot;nav-item active&quot; onclick=&quot;showSection('agendas',this)&quot;><span class=&quot;nav-icon&quot;>📅</span><span>Agendas</span></button>
          <button class=&quot;nav-item&quot; onclick=&quot;showSection('consultores',this)&quot;><span class=&quot;nav-icon&quot;>👥</span><span>Consultores</span></button>
          <button class=&quot;nav-item&quot; onclick=&quot;showSection('produtos',this)&quot;><span class=&quot;nav-icon&quot;>📦</span><span>Produtos</span></button>
          <button class=&quot;nav-item&quot; onclick=&quot;showSection('roadmap',this)&quot;><span class=&quot;nav-icon&quot;>🗺️</span><span>Roadmap</span></button>
          <button class=&quot;nav-item&quot; onclick=&quot;showSection('temas',this)&quot;><span class=&quot;nav-icon&quot;>📚</span><span>Temas</span></button>
          <button class=&quot;nav-item&quot; onclick=&quot;showSection('relatorios',this)&quot;><span class=&quot;nav-icon&quot;>📊</span><span>Relatórios</span></button>
        </nav>
        <div class=&quot;stats-card&quot;>
          <h3>Resumo</h3>
          <div class=&quot;stat-item&quot;><span>Agendas Hoje</span><strong id=&quot;agendasHoje&quot;>0</strong></div>
          <div class=&quot;stat-item&quot;><span>Agendas Este Mês</span><strong id=&quot;agendasMes&quot;>0</strong></div>
          <div class=&quot;stat-item&quot;><span>Consultores Ativos</span><strong id=&quot;consultoresAtivos&quot;>0</strong></div>
          <div class=&quot;stat-item&quot;><span>Capacidade Restante</span><strong id=&quot;capacidadeRestante&quot;>0</strong></div>
        </div>
      </aside>

      <main class=&quot;main-content&quot;>
        <!-- Agendas -->
        <section id=&quot;agendasSection&quot; class=&quot;content-section active&quot;>
          <div class=&quot;section-header&quot;><h2>Gerenciamento de Agendas</h2>
            <button onclick=&quot;openAgendaModal()&quot; class=&quot;btn-primary&quot;>➕ Nova Agenda</button></div>
          <div class=&quot;filters-bar&quot;>
            <input type=&quot;text&quot; id=&quot;searchAgenda&quot; placeholder=&quot;🔍 Buscar agenda...&quot; onkeyup=&quot;filterAgendas()&quot;>
            <select id=&quot;filterConsultor&quot; onchange=&quot;filterAgendas()&quot;><option value=&quot;&quot;>Todos os Consultores</option></select>
            <select id=&quot;filterStatus&quot; onchange=&quot;filterAgendas()&quot;><option value=&quot;&quot;>Todos os Status</option>
              <option value=&quot;Agendada&quot;>Agendada</option><option value=&quot;Realizada&quot;>Realizada</option><option value=&quot;Cancelada&quot;>Cancelada</option></select>
          </div>
          <div class=&quot;table-container&quot;><table class=&quot;data-table&quot;><thead><tr>
            <th>ID</th><th>Data/Hora</th><th>Consultor</th><th>Cliente</th><th>Tema</th><th>Participantes</th><th>Status</th><th>Posts</th><th>Ações</th>
          </tr></thead><tbody id=&quot;agendasTableBody&quot;></tbody></table></div>
        </section>

        <!-- Consultores -->
        <section id=&quot;consultoresSection&quot; class=&quot;content-section&quot;>
          <div class=&quot;section-header&quot;><h2>Gerenciamento de Consultores</h2>
            <button onclick=&quot;mockAction()&quot; class=&quot;btn-primary&quot;>➕ Novo Consultor</button></div>
          <div class=&quot;consultores-grid&quot; id=&quot;consultoresGrid&quot;></div>
        </section>

        <!-- Produtos -->
        <section id=&quot;produtosSection&quot; class=&quot;content-section&quot;>
          <div class=&quot;section-header&quot;><h2>Produtos TR</h2>
            <button onclick=&quot;mockAction()&quot; class=&quot;btn-primary&quot;>➕ Novo Produto</button></div>
          <div class=&quot;produtos-grid&quot; id=&quot;produtosGrid&quot;></div>
        </section>

        <!-- Roadmap -->
        <section id=&quot;roadmapSection&quot; class=&quot;content-section&quot;>
          <div class=&quot;section-header&quot;><h2>Roadmap de Produtos</h2>
            <div style=&quot;display:flex;gap:10px;&quot;>
              <button onclick=&quot;mockAction()&quot; class=&quot;btn-secondary&quot;>📅 Criar Agenda com Roadmap</button>
              <button onclick=&quot;mockAction()&quot; class=&quot;btn-primary&quot;>➕ Novo Item</button></div></div>
          <div class=&quot;filters-bar&quot;>
            <select id=&quot;filterProdutoRoadmap&quot; onchange=&quot;filterRoadmap()&quot;><option value=&quot;&quot;>Todos os Produtos</option></select>
            <select id=&quot;filterStatusRoadmap&quot; onchange=&quot;filterRoadmap()&quot;><option value=&quot;&quot;>Todos os Status</option>
              <option value=&quot;Planejado&quot;>📋 Planejado</option><option value=&quot;Em Desenvolvimento&quot;>⚙️ Em Desenvolvimento</option>
              <option value=&quot;Concluído&quot;>✅ Concluído</option><option value=&quot;Cancelado&quot;>❌ Cancelado</option></select>
            <div class=&quot;view-toggle&quot; style=&quot;margin-left:auto;&quot;>
              <button class=&quot;toggle-btn active&quot; onclick=&quot;switchMainRoadmapView('list',this)&quot; data-view=&quot;list&quot;>📋 Lista</button>
              <button class=&quot;toggle-btn&quot; onclick=&quot;switchMainRoadmapView('timeline',this)&quot; data-view=&quot;timeline&quot;>📅 Timeline</button>
            </div></div>
          <div id=&quot;roadmapListView&quot; class=&quot;roadmap-main-view active&quot;><div class=&quot;roadmap-list&quot; id=&quot;roadmapList&quot;></div></div>
          <div id=&quot;roadmapTimelineMainView&quot; class=&quot;roadmap-main-view&quot; style=&quot;display:none&quot;><div id=&quot;roadmapTimelineMain&quot; class=&quot;roadmap-timeline&quot;></div></div>
        </section>

        <!-- Temas -->
        <section id=&quot;temasSection&quot; class=&quot;content-section&quot;>
          <div class=&quot;section-header&quot;><h2>Temas de Consultoria</h2>
            <button onclick=&quot;mockAction()&quot; class=&quot;btn-primary&quot;>➕ Novo Tema</button></div>
          <div class=&quot;temas-list&quot; id=&quot;temasList&quot;></div>
        </section>

        <!-- Relatórios -->
        <section id=&quot;relatoriosSection&quot; class=&quot;content-section&quot;>
          <div class=&quot;section-header&quot;><h2>Relatórios e Análises</h2></div>
          <div class=&quot;charts-grid&quot;>
            <div class=&quot;chart-card&quot;><h3>Agendas por Consultor</h3><canvas id=&quot;chartConsultores&quot;></canvas></div>
            <div class=&quot;chart-card&quot;><h3>Status de Posts</h3><canvas id=&quot;chartPosts&quot;></canvas></div>
            <div class=&quot;chart-card&quot;><h3>Itens Roadmap por Produto</h3><canvas id=&quot;chartRoadmap&quot;></canvas></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Modal Agenda (simplificado, mesmo estilo) -->
  <div id=&quot;agendaModal&quot; class=&quot;modal&quot;>
    <div class=&quot;modal-content modal-large&quot;>
      <div class=&quot;modal-header&quot;><h2 id=&quot;agendaModalTitle&quot;>Nova Agenda</h2><button onclick=&quot;closeAgendaModal()&quot; class=&quot;btn-close&quot;>✕</button></div>

            ${item.dependeReceita?'<span class=&quot;badge receita&quot;>⚠️ Depende Receita</span>':''}
            ${item.dependencias?'<span class=&quot;badge&quot; style=&quot;background:#E0E7FF;color:#3730A3&quot;>🔗 Tem Dependências</span>':''}</div>
          ${item.previsao?`<div class=&quot;timeline-date&quot;>📅 Previsão de entrega: <strong>${formatDate(item.previsao)}</strong></div>`:''}
          ${item.dependencias?`<div class=&quot;timeline-date&quot;>📌 Dependências: <strong>${esc(item.dependencias)}</strong></div>`:''}
        </div>`;}).join('')}</div></div>`;
  });
  document.getElementById('roadmapTimelineMain').innerHTML=html;
}

function updateStats(){
  const hoje=NOW.toISOString().split('T')[0];
  document.getElementById('agendasHoje').textContent=agendas.filter(a=>a.data===hoje&amp;&amp;a.status==='Agendada').length;
  document.getElementById('agendasMes').textContent=agendas.filter(a=>{
    const d=new Date(a.data+'T00:00:00'); return d.getMonth()===NOW.getMonth()&amp;&amp;d.getFullYear()===NOW.getFullYear()&amp;&amp;(a.status==='Agendada'||a.status==='Realizada');
  }).length;
  document.getElementById('consultoresAtivos').textContent=consultores.filter(c=>c.status==='Ativo').length;
  const tot=consultores.filter(c=>c.status==='Ativo').reduce((s,c)=>s+c.agendasDisponiveis,0);
  const usa=consultores.filter(c=>c.status==='Ativo').reduce((s,c)=>s+c.agendasUsadas,0);
  document.getElementById('capacidadeRestante').textContent=tot-usa;
}

/* =====================================================================
   Navegação + toggles + modal
   ===================================================================== */
function showSection(sec,btn){
  document.querySelectorAll('.content-section').forEach(s=>s.classList.remove('active'));
  document.getElementById(sec+'Section').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(sec==='relatorios') setTimeout(initCharts,40);
}
function switchMainRoadmapView(v,btn){
  document.querySelectorAll('#roadmapSection .toggle-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const list=document.getElementById('roadmapListView'), tl=document.getElementById('roadmapTimelineMainView');
  if(v==='list'){ list.style.display=''; list.classList.add('active'); tl.style.display='none'; }
  else { list.style.display='none'; tl.style.display=''; renderMainTimeline(); }
}
function switchTab(tab,btn){
  document.querySelectorAll('#agendaModal .tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.querySelectorAll('#agendaModal .tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}
function openAgendaModal(id){
  document.getElementById('agendaModalTitle').textContent = id?'Editar Agenda':'Nova Agenda';
  const a = id?agendas.find(x=>x.id===id):null;
  document.getElementById('agendaCliente').value = a?a.cliente:'';
  document.getElementById('agendaData').value = a?a.data:'';
  document.getElementById('agendaHora').value = a?a.hora:'';
  switchTab('basicInfo', document.querySelector('#agendaModal .tab-btn'));
  document.getElementById('agendaModal').classList.add('active');
}
function closeAgendaModal(){ document.getElementById('agendaModal').classList.remove('active'); }
function saveAgenda(){ closeAgendaModal(); toast('Agenda salva com sucesso!'); }

function initCharts(){
  if(typeof Chart==='undefined') return;
  if(window._charts) window._charts.forEach(c=>{try{c.destroy();}catch(e){}});
  window._charts=[];
  const co={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}};
  window._charts.push(new Chart(document.getElementById('chartConsultores'),{type:'bar',
    data:{labels:consultores.map(c=>c.nome),datasets:[{label:'Agendas',data:consultores.map(c=>agendas.filter(a=>a.consultorId===c.id).length),backgroundColor:'#FF8000',borderRadius:6}]},
    options:{...co,plugins:{legend:{display:false}}}}));
  const done=agendas.filter(a=>a.postLinkedin).length, pend=agendas.length-done;
  window._charts.push(new Chart(document.getElementById('chartPosts'),{type:'doughnut',
    data:{labels:['Feitos','Pendentes'],datasets:[{data:[done,pend],backgroundColor:['#10B981','#E5E7EB']}]},options:co}));
  window._charts.push(new Chart(document.getElementById('chartRoadmap'),{type:'bar',
    data:{labels:produtos.map(p=>p.nome),datasets:[{label:'Itens',data:produtos.map(p=>roadmap.filter(r=>r.produtoId===p.id).length),backgroundColor:produtos.map(p=>p.cor),borderRadius:6}]},
    options:{...co,plugins:{legend:{display:false}}}}));
}

/* Popular selects + init */
function fillSelects(){
  document.getElementById('filterConsultor').innerHTML='<option value=&quot;&quot;>Todos os Consultores</option>'+consultores.map(c=>`<option>${esc(c.nome)}</option>`).join('');
  document.getElementById('filterProdutoRoadmap').innerHTML='<option value=&quot;&quot;>Todos os Produtos</option>'+produtos.map(p=>`<option value=&quot;${p.id}&quot;>${esc(p.nome)}</option>`).join('');
  const ac=document.getElementById('agendaConsultor'); if(ac) ac.innerHTML='<option value=&quot;&quot;>Selecione...</option>'+consultores.map(c=>`<option>${esc(c.nome)}</option>`).join('');
  const at=document.getElementById('agendaTema'); if(at) at.innerHTML='<option value=&quot;&quot;>Selecione...</option>'+temas.map(t=>`<option>${esc(t.nome)}</option>`).join('');
}

fillSelects();
loadAgendas(); loadConsultores(); loadProdutos(); loadTemas(); loadRoadmap();
updateStats();
</script>

      </div></td></tr>`).join('')}</tbody></table></div>`;
}

    <div class=&quot;panel-head&quot; style=&quot;background:#fff;border:1px solid var(--tr-line);border-radius:12px;margin-bottom:20px&quot;>
      <h3>🗺️ Roadmap oficial</h3><div class=&quot;spacer&quot;></div>

  const render=()=>{ const st=$('#f-status').value,og=$('#f-origin').value,tx=($('#f-text').value||'').toLowerCase();
    const list=Store.getDemands().filter(d=>(!st||d.status===st)&amp;&amp;(!og||d.origin===og)&amp;&amp;(!tx||(d.title+d.code+(d.client||'')).toLowerCase().includes(tx)));
    $('#todas-table').innerHTML=list.length?fullTable(list):emptyState('Nenhuma demanda encontrada com esses filtros.','🔍'); };
  ['f-status','f-origin'].forEach(id=>$('#'+id).addEventListener('change',render));
  $('#f-text').addEventListener('input',render); render();
}

function openModal({title,wide,body,foot}){
  const root=$('#modal-root');
  root.innerHTML=`<div class=&quot;modal ${wide?'wide':''}&quot;><div class=&quot;modal-head&quot;><h3>${esc(title)}</h3><button class=&quot;x&quot; onclick=&quot;closeModal()&quot;>×</button></div>
    <div class=&quot;modal-body&quot;>${body}</div><div class=&quot;modal-foot&quot;>${foot||''}</div></div>`;
  root.classList.add('show');
}
function closeModal(){ $('#modal-root').classList.remove('show'); }
function openDemand(id){
  const d=Store.getDemands().find(x=>x.id===id); if(!d) return;
  openModal({ title:`${d.code} — Detalhes da demanda`, wide:true, body:`
    <div style=&quot;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px&quot;><h3 style=&quot;flex:1;font-size:18px&quot;>${esc(d.title)}</h3>${statusBadge(d.status)}</div>
    ${stepperHTML(d)}<div style=&quot;height:18px&quot;></div>
    <dl class=&quot;dl&quot;>
      <dt>Descrição</dt><dd>${esc(d.description)||'—'}</dd>
      <dt>Origem</dt><dd>${originBadge(d.origin)} ${d.externalRef?`<span class=&quot;badge b-gray&quot;>${esc(d.externalRef)}</span>`:''}</dd>
      <dt>Solicitante</dt><dd>${esc(d.requesterName)} <span class=&quot;text-muted&quot;>· ${esc(d.team)}</span></dd>
      <dt>Produto / Área</dt><dd>${esc(d.productName)||'—'}</dd>
      <dt>Cliente</dt><dd>${esc(d.client)||'—'}</dd>
      <dt>Prioridade</dt><dd>${prioBadge(d.priority)}</dd>
      ${d.deliveryDate?`<dt>Data de entrega</dt><dd><b>${fmtDate(d.deliveryDate)}</b></dd>`:''}
      <dt>Criada em</dt><dd>${fmtDateTime(d.createdAt)}</dd></dl>
    <div class=&quot;section-title mt-3&quot;>Histórico de aprovações</div>
    <div class=&quot;timeline&quot;>${d.history.slice().reverse().map(h=>{const tone=h.status==='roadmap'?'green':(h.status==='rejeitada'?'red':'');
      return `<div class=&quot;tl-item ${tone}&quot;><div class=&quot;tl-dot&quot;></div><div class=&quot;tl-act&quot;>${esc(h.action)}</div>
        <div class=&quot;tl-meta&quot;>${esc(h.actorName)} · ${Store.ROLES[h.role]?.label||h.role} · ${fmtDateTime(h.date)}</div>
        ${h.comment?`<div class=&quot;tl-comment&quot;>${esc(h.comment)}</div>`:''}</div>`;}).join('')}</div>`,
    foot:`<button class=&quot;btn btn-ghost&quot; onclick=&quot;closeModal()&quot;>Fechar</button>` });
}
function approve(id,stage){
  const d=Store.getDemands().find(x=>x.id===id); if(!d) return;
  const u=Auth.user(); const now=new Date().toISOString();
  if(stage==='dm'){ d.status='pendente_produto'; d.history.push({date:now,actorName:u.name,role:'demand_manager',action:'Aprovada pelo Demand Management Manager',status:'pendente_produto',comment:''}); toast('Demanda aprovada e enviada ao Produto.','success'); }
  else { d.status='roadmap'; d.deliveryDate=d.deliveryDate||'2026-12-31'; d.history.push({date:now,actorName:u.name,role:'produto',action:'Aprovada e incluída no Roadmap',status:'roadmap',comment:'Incluída no roadmap.'}); toast('Demanda publicada no roadmap!','success'); }
  d.updatedAt=now; renderShell(); navigate(document.querySelector('.nav-item.active').dataset.route);
}
function reject(id){
  const d=Store.getDemands().find(x=>x.id===id); if(!d) return;
  const u=Auth.user(); const now=new Date().toISOString();
  d.status='rejeitada'; d.history.push({date:now,actorName:u.name,role:u.role,action:'Demanda rejeitada',status:'rejeitada',comment:'Rejeitada no fluxo de aprovação.'});
  d.updatedAt=now; toast('Demanda rejeitada.','error'); renderShell(); navigate(document.querySelector('.nav-item.active').dataset.route);
}
function onSearch(e){
  const tx=(e.target.value||'').toLowerCase();
  if(document.querySelector('.nav-item.active').dataset.route!=='todas'){ if(tx) navigate('todas'); }
  const f=$('#f-text'); if(f){ f.value=e.target.value; f.dispatchEvent(new Event('input')); }
}
function toast(msg,cls=''){
  const w=$('#toast-root'); const t=document.createElement('div'); t.className='toast '+cls;
  t.innerHTML=`<div class=&quot;ti&quot;>${cls==='error'?'⚠️':(cls==='success'?'✅':'ℹ️')}</div><div><div class=&quot;tt&quot;>${esc(msg)}</div></div>`;
  w.appendChild(t); setTimeout(()=>t.remove(),3000);
}

/* Init — &quot;login&quot; automático como admin */
renderShell(); navigate('dashboard');
</script>

<script>
function activate(k){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
  document.querySelectorAll('.frame').forEach(f=>f.classList.remove('show'));
  var f=document.getElementById('f-'+k);
  if(!f) return;
  if(!f.getAttribute('srcdoc')) f.setAttribute('srcdoc', f.dataset.srcdoc);
  f.classList.add('show');
}
window.addEventListener('message',function(e){ if(e.data && e.data.go) activate(e.data.go); });
activate('cockpit');
</script>
